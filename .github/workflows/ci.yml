name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests with coverage (service layer must stay at 70 % or more)
        run: |
          pytest --cov=app --cov-report=term-missing
          pytest --cov=app/services --cov-fail-under=70 -q
      - name: Docker image builds
        run: docker build -t xptoirl .
