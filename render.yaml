# Render Blueprint: creates the web service and the PostgreSQL database in one step.
# On https://dashboard.render.com choose "New > Blueprint" and select this repository.
services:
  - type: web
    name: xptoirl
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: xptoirl-db
          property: connectionString
      # Set both in the dashboard to create the administrator on the first start.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: xptoirl-db
    plan: free
    databaseName: xptoirl
    user: xptoirl
